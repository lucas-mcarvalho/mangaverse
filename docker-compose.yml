name: mangaverse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangaverse}
      POSTGRES_USER: ${POSTGRES_USER:-mangaverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:${SUWAYOMI_TAG:-stable}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      FLARESOLVERR_ENABLED: ${SUWAYOMI_FLARESOLVERR_ENABLED:-true}
      FLARESOLVERR_URL: http://byparr:8191
      # Desafios do Cloudflare às vezes levam mais de 60 s para o Byparr resolver.
      FLARESOLVERR_TIMEOUT: "100"
      FLARESOLVERR_RESPONSE_AS_FALLBACK: "true"
    depends_on:
      - byparr
    volumes:
      - suwayomi_data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "127.0.0.1:${SUWAYOMI_PORT:-4567}:4567"

  # Integração recomendada pelo Suwayomi para fontes protegidas por Cloudflare.
  # A porta fica acessível apenas aos contêineres desta rede.
  byparr:
    image: ghcr.io/thephaseless/byparr:${BYPARR_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

  translator:
    build: ./translator
    restart: unless-stopped
    volumes:
      - translation_models:/models
    # Serviço interno: imagens não são enviadas a APIs externas.
    environment:
      # Threads de CPU do detector de texto; reduza em máquinas com poucos núcleos.
      OMP_NUM_THREADS: "4"
      # Minutos sem páginas até descarregar os modelos e devolver a memória (1 a 4 GB) ao sistema.
      TRANSLATOR_IDLE_MINUTES: "5"
      # Tradução por LLM local (Ollama). Deixe TRANSLATOR_LLM_URL vazio para usar só o Argos.
      TRANSLATOR_LLM_URL: ${TRANSLATOR_LLM_URL-http://ollama:11434}
      TRANSLATOR_LLM_MODEL: ${TRANSLATOR_LLM_MODEL:-qwen3:4b-instruct}
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Somente rede interna; o modelo sai da memória 5 min após a última página.
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

  backend:
    build: ./backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mangaverse}
      DB_USERNAME: ${POSTGRES_USER:-mangaverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MANGAVERSE_ADMIN_USERNAME: ${MANGAVERSE_ADMIN_USERNAME:-admin}
      MANGAVERSE_ADMIN_PASSWORD: ${MANGAVERSE_ADMIN_PASSWORD:-}
      MANGAVERSE_STORAGE_ALLOWED_ROOTS: /library,/extra
      MANGAVERSE_LIBRARY_DIR: /library
      MANGAVERSE_DATA_DIR: /data
      SUWAYOMI_URL: http://suwayomi:4567
      SUWAYOMI_ENABLED: ${SUWAYOMI_ENABLED:-true}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      COMICVINE_API_KEY: ${COMICVINE_API_KEY:-}
      MANGAVERSE_USER_AGENT: ${MANGAVERSE_USER_AGENT:-MangaVerse/0.1 (self-hosted)}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      MANGAVERSE_TRANSLATION_URL: http://translator:8091
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      # Biblioteca principal no host (downloads e importação)
      - ${MANGAVERSE_LIBRARY_HOST_DIR:-./data/library}:/library
      # Diretório extra opcional (ex.: outro disco). Monte aqui e use /extra/... nas Configurações.
      - ${MANGAVERSE_EXTRA_HOST_DIR:-./data/extra}:/extra
      # Dados internos (cache de CBR e temporários de download)
      - backend_data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5180}:80"

volumes:
  postgres_data:
  suwayomi_data:
  backend_data:
  translation_models:
  ollama_models:
