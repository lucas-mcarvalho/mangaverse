# Usa a GPU NVIDIA no tradutor (detecção de texto) e no Ollama (LLM).
# Requer o NVIDIA Container Toolkit no host. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build translator ollama
services:
  translator:
    build:
      context: ./translator
      args:
        TORCH_INDEX: cu124
    environment:
      TRANSLATOR_GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
